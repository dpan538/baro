<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BARO · Xiaomi Pad 9 Pro Max 设备预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce1d8;color:#151d1c;font:14px/1.4 system-ui,sans-serif}header{height:64px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:16px;font-weight:500;margin:0}p{margin:3px 0 0;font-size:12px}.controls{display:flex;gap:10px;align-items:center}select{font:inherit;background:#fcfcf8;border:1px solid #9aa793;border-radius:5px;padding:6px}main{height:calc(100dvh - 64px);display:grid;place-items:center;overflow:hidden;padding:8px}.device-view{position:relative;overflow:clip;background:#191e1d;flex:none}iframe{display:block;border:0;transform-origin:top left}@media(max-width:800px){header{height:106px;display:block}.controls{margin-top:7px}main{height:calc(100dvh - 106px)}}
</style></head><body><header><div><h1>Xiaomi Pad 9 Pro Max · 设备比例预览</h1><p id="spec"></p></div><div class="controls"><label>方向 <select id="orientation"><option value="landscape">横屏 3:2</option><option value="portrait">竖屏 2:3</option></select></label><label>页面 <select id="page"><option value="sky">环境观测</option><option value="weather">今日天气</option></select></label><label>语言 <select id="lang"><option value="zh">中文</option><option value="en">English</option></select></label></div></header><main><div class="device-view"><iframe id="tablet" title="小米 Pad 9 Pro Max 完整页面"></iframe></div></main>
<script type="module">
import {XIAOMI_PAD_9_PRO_MAX,tabletReferenceViewport} from './tablet-profile.js';
const q=new URLSearchParams(location.search),frame=document.querySelector('iframe'),view=document.querySelector('.device-view'),host=document.querySelector('main');
for(const id of ['orientation','page','lang']){const select=document.getElementById(id);if([...select.options].some(x=>x.value===q.get(id)))select.value=q.get(id);select.addEventListener('change',update);}
let reference;
function resize(){if(!reference)return;const scale=Math.min((host.clientWidth-16)/reference.width,(host.clientHeight-16)/reference.height);view.style.width=reference.width*scale+'px';view.style.height=reference.height*scale+'px';frame.style.transform='scale('+scale+')';}
function update(){const orientation=document.getElementById('orientation').value,page=document.getElementById('page').value,lang=document.getElementById('lang').value;reference=tabletReferenceViewport(orientation);frame.style.width=reference.width+'px';frame.style.height=reference.height+'px';const next=new URL(location.href);for(const [k,v] of Object.entries({orientation,page,lang}))next.searchParams.set(k,v);history.replaceState(null,'',next);const physical=orientation==='portrait'?[XIAOMI_PAD_9_PRO_MAX.pixelHeight,XIAOMI_PAD_9_PRO_MAX.pixelWidth]:[XIAOMI_PAD_9_PRO_MAX.pixelWidth,XIAOMI_PAD_9_PRO_MAX.pixelHeight];document.getElementById('spec').textContent='物理 '+physical.join('×')+' · 参考 CSS '+reference.width+'×'+reference.height+' · 2×仅为验收参考，不代表真机 DPR';frame.src='/?weather='+encodeURIComponent(q.get('weather')||'storm')+'&lang='+lang+'&pixels=fine&motion=off&temperature=c&wind=kmh&page='+page;resize();}
new ResizeObserver(resize).observe(host);update();
</script></body></html>
