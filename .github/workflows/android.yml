name: Kotlin Android and BARO backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: python3 -m unittest discover -s backend/tests -v
      - run: python3 -m unittest discover -s feedback-service -p 'test_*.py' -v
      - run: scripts/prepare-native-dev.sh
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: android/gradlew -p android --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable KVM for the disposable emulator
        run: |
          sudo chmod 666 /dev/kvm
      - run: scripts/ci-native-emulator.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: BARO-native-debug-and-ui-test-logs
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
            output/native-ci/
          retention-days: 14
          if-no-files-found: error
